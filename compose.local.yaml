services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nodo_local}
      MYSQL_USER: ${MYSQL_USER:-nodo_local}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nodo_local_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nodo_local_root_dev_only}
    volumes:
      - nodo_mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${NODO_MYSQL_PORT:-3307}:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping --silent --host=127.0.0.1 --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-nodo_local}:${MYSQL_PASSWORD:-nodo_local_dev_only}@db:3306/${MYSQL_DATABASE:-nodo_local}
      PORT: "3000"
      WEB_ROOT: /app/dist/public
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  nodo_mysql_data:
