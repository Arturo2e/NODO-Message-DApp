[package]
name    = "nodo"
version = "0.1.0"
authors = ["Manoa Aguilar"]
edition = "2026"

[dependencies]
dioxus = { 
  version = "0.7.1", 
  features = [] 
}

base64 = "0.22"
hex    = "0.4"

ring   = { 
  version  = "0.17", 
  features = ["wasm32_unknown_unknown_js"] 
}

serde = { 
  version  = "1", 
  features = ["derive"] 
}

serde_json = "1"
sha3       = "0.10"

vodozemac  = { 
  version  = "0.11.1", 
  features = ["wasm_js"] 
}

zeroize    = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys       = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

gloo-timers = { 
  version  = "0.3", 
  features = ["futures"] 
}

web-sys = { 
  version = "0.3", 
  features = [
    "Window", 
    "Storage", 
    "Event", 
    "CustomEvent", 
    "EventTarget", 
    "Navigator", 
    "Clipboard"
  ] 
}

[features]
default = ["web"]
web     = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile  = ["dioxus/mobile"]
